<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="mindterms">
  <!--
    Шкала доказовості: той самий знак, що стоїть на кожній картці поняття,
    дві залиті крапки з трьох. Третю згашено прозорістю, а не обведено
    кільцем, бо тонкий штрих зникає при зменшенні до 16 px.
    Кольори взяті зі змінних variables.css: акцент і тло сторінки.
  -->
  <rect width="32" height="32" rx="7" fill="#5b4a8c" />
  <circle cx="7.5" cy="16" r="3.6" fill="#f1f3ee" />
  <circle cx="16" cy="16" r="3.6" fill="#f1f3ee" />
  <circle cx="24.5" cy="16" r="3.6" fill="#f1f3ee" opacity=".36" />
</svg>
